{% set name = "docstrfmt" %}
{% set version = "2.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/docstrfmt-{{ version }}.tar.gz
  sha256: 9f35b62e746962efe32f7af27b3bf69e104a4e69827a49a9f488da770271bd0e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - docstrfmt = docstrfmt.main:main
    - docstrfmtd = docstrfmt.server:main

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.4,<4
    - pip
  run:
    - python >={{ python_min }}
    - black >=24
    - click >=8
    - coverage >=7.11
    - docutils >=0.21
    - libcst >=1
    - platformdirs >=4
    - roman
    - sphinx >=7
    - tabulate >=0.9
    - toml >=0.10
    - aiohttp >=3
    - docutils-stubs 0.0.22.*
    - types-docutils 0.22.3.20260518.*

test:
  imports:
    - docstrfmt
  commands:
    - pip check
    - docstrfmt --help
    - docstrfmtd --help
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: 'docstrfmt: A formatter for Sphinx flavored reStructuredText.'
  home: https://pypi.org/project/docstrfmt
  dev_url: https://github.com/LilSpazJoekp/docstrfmt
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - anjos
